name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check extension scripts
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
      - name: Run unit tests
        run: node --test
      - name: Build release ZIP and verify
        run: |
          node scripts/pack.mjs
          unzip -t dist/waitspark-chrome-extension-v*.zip
