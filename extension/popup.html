<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>WaitSpark 设置</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px 16px 16px 16px;
      width: 344px;
      background: #ffffff;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      font-size: 13px;
      line-height: 1.45;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f1f5f9;
    }
    .title-wrap { display: flex; align-items: center; gap: 7px; }
    .dot {
      width: 8px; height: 8px; border-radius: 999px;
      background: linear-gradient(135deg, #f59e0b, #0ea5e9);
    }
    h1 { margin: 0; font-size: 14px; font-weight: 600; color: #0f172a; }
    .sub { font-size: 11px; color: #64748b; }
    .switch-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #f8fafc; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 8px 11px; margin-bottom: 12px;
    }
    .switch-label { font-weight: 500; color: #0f172a; }
    .field { margin-bottom: 9px; }
    label.flabel {
      display: block; font-size: 11.5px; font-weight: 500;
      color: #475569; margin-bottom: 4px;
    }
    input[type="text"], input[type="password"], select {
      width: 100%; padding: 7px 9px; border: 1px solid #d1d5db;
      border-radius: 8px; background: #ffffff; color: #0f172a;
      font-family: inherit; font-size: 12.5px; outline: none;
      transition: border-color 0.14s ease, box-shadow 0.14s ease;
    }
    input:focus, select:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.14);
    }
    .hidden { display: none; }
    .actions { display: flex; gap: 7px; margin-top: 12px; }
    button {
      flex: 1; appearance: none; border-radius: 9px; padding: 8px 8px;
      font-family: inherit; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: all 0.14s ease;
    }
    .btn-primary { background: #0f172a; color: #ffffff; border: 1px solid #0f172a; }
    .btn-primary:hover { background: #1e293b; }
    .btn-secondary { background: #f8fafc; color: #0f172a; border: 1px solid #d1d5db; }
    .btn-secondary:hover { background: #f1f5f9; border-color: #94a3b8; }
    .status {
      margin-top: 9px;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 11.5px;
      line-height: 1.45;
      word-break: break-all;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .status.empty { display: none; }
    .status.warn {
      background: #fffbeb;
      color: #b45309;
      border-color: #fde68a;
    }
    .hint {
      margin-top: 10px; padding-top: 8px; border-top: 1px solid #f1f5f9;
      font-size: 11px; color: #64748b; line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="head">
    <div class="title-wrap">
      <span class="dot"></span>
      <div>
        <h1>WaitSpark</h1>
        <div class="sub">聊天框上方 · 浅色灵感与查漏气泡</div>
      </div>
    </div>
  </div>

  <div class="switch-row">
    <span class="switch-label">发送消息后自动静默弹出气泡</span>
    <input type="checkbox" id="enabled" checked />
  </div>

  <div class="field">
    <label class="flabel" for="provider">模型接口</label>
    <select id="provider">
      <option value="demo">离线演示模式（免 Key，立即体验）</option>
      <option value="deepseek">DeepSeek（api.deepseek.com）</option>
      <option value="openai">OpenAI / 兼容中转站</option>
      <option value="gemini">Google Gemini</option>
      <option value="anthropic">Anthropic Claude</option>
      <option value="ollama">本地 Ollama（免 Key）</option>
    </select>
  </div>

  <div id="api-fields" class="hidden">
    <div class="field" id="baseurl-wrap">
      <label class="flabel" for="baseUrl">Base URL</label>
      <input type="text" id="baseUrl" placeholder="https://api.deepseek.com/v1" />
    </div>
    <div class="field">
      <label class="flabel" for="model">模型名称</label>
      <input type="text" id="model" placeholder="deepseek-chat / gpt-4.1-mini / gemini-2.5-flash" />
    </div>
    <div class="field" id="apikey-wrap">
      <label class="flabel" for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="sk-... / AIza..." autocomplete="off" />
    </div>
  </div>

  <div class="actions">
    <button type="button" class="btn-primary" id="btn-save">保存配置</button>
    <button type="button" class="btn-secondary" id="btn-test">测试模型</button>
    <button type="button" class="btn-secondary" id="btn-preview">预览气泡</button>
  </div>

  <div class="status empty" id="status"></div>

  <div class="hint">
    支持站点：ChatGPT / Codex Web、Claude、Gemini。折叠态仅展示 1~2 条「灵感 / 查漏」，点击原地展开详答或作答，单击收起或关闭。
  </div>

  <script src="popup.js"></script>
</body>
</html>
